name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      - name: Acceptance tests must not be skipped
        shell: bash
        run: |
          npx vitest run tests/acceptance --reporter=json --outputFile=acceptance-report.json
          node -e "const r=require('./acceptance-report.json'); const s=r.numPendingTests+r.numTodoTests; if (s) { console.error('skipped acceptance tests: '+s); process.exit(1); } console.log('acceptance: '+r.numPassedTests+' passed, 0 skipped');"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtimes: node,python,php,go,java,dotnet
          - os: windows-latest
            runtimes: node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUNTIME_MATRIX_REQUIRE: ${{ matrix.runtimes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version: '1.25'
          cache: false
      - uses: shivammathur/setup-php@v2
        if: runner.os == 'Linux'
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Linux'
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Run target processes and record evidence
        shell: bash
        run: npm run --silent runtime-matrix -- --only="$RUNTIME_MATRIX_REQUIRE" --json > runtime-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-matrix-${{ matrix.os }}
          path: runtime-matrix.json
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (git history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        run: >
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/secrets --config p/nodejsscan
          --exclude node_modules --exclude dist --exclude compliance
