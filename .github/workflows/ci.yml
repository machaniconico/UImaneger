name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      - name: Acceptance tests must not be skipped
        shell: bash
        run: |
          npx vitest run tests/acceptance --reporter=json --outputFile=acceptance-report.json
          node -e "const r=require('./acceptance-report.json'); const s=r.numPendingTests+r.numTodoTests; if (s) { console.error('skipped acceptance tests: '+s); process.exit(1); } console.log('acceptance: '+r.numPassedTests+' passed, 0 skipped');"
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox webkit
          - os: windows-latest
            browsers: chromium firefox
          - os: macos-latest
            browsers: chromium firefox webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install browsers
        shell: bash
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Run E2E on each browser
        shell: bash
        run: npx playwright test $(printf -- '--project=%s ' ${{ matrix.browsers }})
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.os }}
          path: test-results/
  runtime-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtimes: node,python,php,go,java,dotnet
          - os: windows-latest
            runtimes: node
          - os: ubuntu-latest
            runtimes: ruby,elixir
          - os: windows-latest
            runtimes: python,php,go,java,dotnet
          - os: macos-latest
            runtimes: node,python,go,java
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 35 || 60 }}
    env:
      RUNTIME_MATRIX_REQUIRE: ${{ matrix.runtimes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
      - name: Locate Windows npm cache
        if: runner.os == 'Windows'
        id: windows-npm-cache
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: ${{ steps.windows-npm-cache.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-runtime-npm-${{ hashFiles('package-lock.json', 'scripts/runtime-matrix-fixtures.mjs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-runtime-npm-
      - uses: actions/setup-go@v6
        if: contains(matrix.runtimes, 'go')
        with:
          go-version: '1.25'
          cache: false
      - uses: shivammathur/setup-php@v2
        if: contains(matrix.runtimes, 'php')
        with:
          php-version: '8.4'
          tools: composer:v2
          # Laravel 12 の依存(league/flysystem-local)が ext-fileinfo を要求する。Windows の既定 PHP には無い
          extensions: fileinfo
          coverage: none
      - uses: actions/setup-python@v6
        if: contains(matrix.runtimes, 'python')
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        if: contains(matrix.runtimes, 'java')
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: contains(matrix.runtimes, 'java')
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
      - uses: actions/setup-dotnet@v5
        if: contains(matrix.runtimes, 'dotnet')
        with:
          dotnet-version: '10.0.x'
      - uses: ruby/setup-ruby@v1
        if: contains(matrix.runtimes, 'ruby')
        with:
          ruby-version: '3.4'
      - uses: erlef/setup-beam@v1
        if: contains(matrix.runtimes, 'elixir')
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: npm ci
      - name: Run target processes and record evidence
        shell: bash
        run: npm run --silent runtime-matrix -- --only="$RUNTIME_MATRIX_REQUIRE" --json > runtime-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-matrix-${{ matrix.os }}-${{ matrix.runtimes }}
          path: runtime-matrix.json
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (git history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        run: >
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/secrets --config p/nodejsscan
          --exclude node_modules --exclude dist --exclude compliance
  # auto-merge (.github/workflows/auto-merge.yml) とブランチ保護の必須チェック名は "test"。
  # matrix ジョブは "unit (os, node)" のように名前が展開されるため、全ジョブの成否を
  # 集約する単一ジョブ "test" を必須チェックとして置く。
  test:
    name: test
    if: ${{ always() }}
    needs: [unit, e2e, runtime-matrix, audit, secret-scan, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e "const n=JSON.parse(process.env.NEEDS); const bad=Object.entries(n).filter(([,v])=>v.result!=='success'); for (const [k,v] of bad) console.error(k+': '+v.result); if (bad.length) process.exit(1); console.log('all '+Object.keys(n).length+' jobs succeeded');"
